<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Grid of Greed - table</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap">
<style>
:root{--bg:#0c0b10;--card:#15131c;--gold:#b8923a;--line:#3a3648;--txt:#c9c4d6;--mut:#8a8698;
--neg:#4a8cff;--zero:#6fd6e6;--low:#5fcf80;--mid:#e9d24c;--high:#ef5b5b;--k:.7;--u:48px;
--gw:calc(var(--u)*4.54);--gh:calc(var(--u)*4.05)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--txt);font:15px/1.4 Georgia,serif;height:100vh;display:flex;flex-direction:column}
header{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:10px 16px;border-bottom:1px solid var(--line);flex-wrap:wrap}
h1{margin:0;font:700 18px Fraunces,Georgia,serif;color:var(--gold)}
.ctl{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.ctl button{background:none;border:1px solid var(--line);color:var(--txt);border-radius:6px;padding:4px 10px;font:inherit;cursor:pointer}
.ctl button[aria-pressed=true]{border-color:var(--gold);color:var(--gold)}
button:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
main{flex:1;display:flex;align-items:center;justify-content:center;min-height:0}
.board{display:grid;gap:10px;grid-template-columns:calc(var(--gw)*var(--k)) var(--gw) calc(var(--gw)*var(--k));grid-template-rows:calc(var(--gh)*var(--k)) calc(var(--gh)*var(--k)) var(--gh)}
.seat{display:flex;flex-direction:column;align-items:center;justify-content:center;border:1px solid var(--line);border-radius:10px;--su:calc(var(--u)*var(--k))}
.seat.me{--su:var(--u);border-color:var(--gold)}
.seat.active{border-color:var(--gold);box-shadow:0 0 0 1px var(--gold)}
.meta{display:flex;gap:8px;align-items:baseline;font-size:max(11px,calc(var(--su)*.4));margin-bottom:calc(var(--su)*.15)}
.meta b{font-weight:500}.meta span{color:var(--mut)}.me .meta b{color:var(--gold)}
.grid{display:grid;grid-template-columns:repeat(4,var(--su));gap:calc(var(--su)*.18)}
.mid{grid-area:2/2;display:flex;gap:calc(var(--u)*.4);align-items:center;justify-content:center;--su:calc(var(--u)*var(--k))}
.card{width:var(--su);height:var(--su);padding:0;border:0;background:none;perspective:400px;cursor:pointer}
.in{position:relative;display:block;width:100%;height:100%;transform-style:preserve-3d;transition:transform .5s}
.card.up .in{transform:rotateY(180deg)}
.f,.b{position:absolute;inset:0;border-radius:calc(var(--su)*.1);backface-visibility:hidden;background:var(--card);display:flex;align-items:center;justify-content:center}
.b{border:1.5px solid var(--gold)}
.b::before{content:"";position:absolute;inset:12%;border:1px solid var(--gold);opacity:.4;border-radius:calc(var(--su)*.06)}
.b::after{content:"";width:26%;height:26%;border:1.5px solid var(--gold);transform:rotate(45deg)}
.f{transform:rotateY(180deg);border:1.5px solid var(--c);color:var(--c);font:500 calc(var(--su)*.52)/1 Fraunces,Georgia,serif}
[data-r=n]{--c:var(--neg)}[data-r=z]{--c:var(--zero)}[data-r=l]{--c:var(--low)}[data-r=m]{--c:var(--mid)}[data-r=h]{--c:var(--high)}
@media (prefers-reduced-motion:reduce){.in{transition:none}}
</style>
</head>
<body>
<header>
<h1>Grid of Greed</h1>
<div class="ctl"><span>Joueurs</span><span id="np"></span><button id="deal">Nouvelle donne</button><button id="next">Tour suivant</button></div>
</header>
<main><div class="board" id="board"></div></main>
<script>
const NAMES=['Toi','Léa','Tom','Sam','Zoé','Max','Eli','Ana'];
const POS={BL:[1,3],ML:[1,2],TL:[1,1],TM:[2,1],TR:[3,1],MR:[3,2],BR:[3,3]};
const SEATS={2:['TM'],3:['TL','TR'],4:['ML','TM','MR'],5:['ML','TL','TR','MR'],6:['ML','TL','TM','TR','MR'],7:['BL','ML','TL','TR','MR','BR'],8:['BL','ML','TL','TM','TR','MR','BR']};
const range=v=>v<0?'n':v==0?'z':v<5?'l':v<9?'m':'h';
let n=4,active=0,players=[],discard=0;
function shuffle(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function deck(){const d=[];for(let i=0;i<5;i++)d.push(-2);for(let i=0;i<10;i++)d.push(-1);for(let i=0;i<15;i++)d.push(0);for(let v=1;v<=12;v++)for(let i=0;i<10;i++)d.push(v);return shuffle(d)}
function deal(){const d=deck();players=[];for(let p=0;p<n;p++){const cards=d.splice(0,12).map(v=>({v,up:false}));shuffle([...cards.keys()]).slice(0,2).forEach(i=>cards[i].up=true);players.push(cards)}discard=d.pop();active=0;render()}
const score=c=>c.reduce((s,x)=>s+(x.up?x.v:0),0);
function cardEl(c,p,i){const b=document.createElement('button');b.className='card'+(c.up?' up':'');b.dataset.r=range(c.v);b.setAttribute('aria-label',c.up?'Carte '+c.v:'Carte cachée');b.innerHTML='<span class="in"><span class="b"></span><span class="f">'+c.v+'</span></span>';if(p===0)b.onclick=()=>{c.up=!c.up;b.classList.toggle('up',c.up);updateScores()};return b}
function seat(p,area){const s=document.createElement('div');s.className='seat'+(p===0?' me':'')+(p===active?' active':'');s.style.gridArea=area[1]+'/'+area[0];s.innerHTML='<div class="meta"><b>'+NAMES[p]+'</b><span></span></div><div class="grid"></div>';const g=s.lastChild;players[p].forEach((c,i)=>g.append(cardEl(c,p,i)));s.dataset.p=p;return s}
function render(){const bd=document.getElementById('board');bd.innerHTML='';bd.append(seat(0,[2,3]));SEATS[n].forEach((k,i)=>bd.append(seat(i+1,POS[k])));const m=document.createElement('div');m.className='mid';const back=cardEl({v:0,up:false}),top=cardEl({v:discard,up:true});back.onclick=top.onclick=null;m.append(back,top);bd.append(m);updateScores();fit()}
function updateScores(){document.querySelectorAll('.seat').forEach(s=>s.querySelector('.meta span').textContent=score(players[+s.dataset.p]))}
function fit(){const k=n<=4?.7:n<=6?.6:.5,m=document.querySelector('main');const u=Math.max(14,Math.min(64,(m.clientWidth-40)/(4.54*(1+2*k)),(m.clientHeight-40)/(4.05*(1+2*k))));const r=document.documentElement.style;r.setProperty('--k',k);r.setProperty('--u',u+'px')}
const np=document.getElementById('np');for(let i=2;i<=8;i++){const b=document.createElement('button');b.textContent=i;b.onclick=()=>{n=i;[...np.children].forEach(x=>x.setAttribute('aria-pressed',x===b));deal()};b.setAttribute('aria-pressed',i===n);np.append(b)}
document.getElementById('deal').onclick=deal;
document.getElementById('next').onclick=()=>{active=(active+1)%n;document.querySelectorAll('.seat').forEach(s=>s.classList.toggle('active',+s.dataset.p===active))};
addEventListener('resize',fit);deal();
</script>
</body>
</html>
