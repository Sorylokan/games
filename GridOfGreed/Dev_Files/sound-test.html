<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>Banc d'essai sons de carte</title>
<style>
  body { font: 15px/1.5 system-ui, sans-serif; background: #12141c; color: #cdd3e0; max-width: 640px; margin: 40px auto; padding: 0 16px; }
  h1 { font-size: 20px; }
  button { display: block; width: 100%; margin: 6px 0; padding: 12px; font: inherit; text-align: left;
           background: #1c2030; color: inherit; border: 1px solid #333a52; border-radius: 8px; cursor: pointer; }
  button:hover { border-color: #7fa8d9; }
  button b { color: #7fa8d9; }
  .vol { display: flex; gap: 10px; align-items: center; margin: 16px 0; }
  input[type=range] { flex: 1; }
  .note { color: #8891a8; font-size: 13px; }
</style>
</head>
<body>
<h1>Banc d'essai — sons de carte</h1>
<p class="note">Clique sur chaque variante. Quand tu as choisi, donne-moi le numéro et je l'intègre dans sound.js.</p>
<div class="vol">
  Volume <input type="range" id="vol" min="0" max="100" value="50"> <span id="volv">50%</span>
</div>
<div id="list"></div>

<script>
let ctx = null, master = null, noise = null;
function ensure() {
  if (ctx) { if (ctx.state === "suspended") ctx.resume(); return; }
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  master = ctx.createGain();
  master.gain.value = document.getElementById("vol").value / 100;
  master.connect(ctx.destination);
  noise = ctx.createBuffer(1, Math.floor(ctx.sampleRate * 0.1), ctx.sampleRate);
  const d = noise.getChannelData(0);
  for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
}
document.getElementById("vol").addEventListener("input", (e) => {
  document.getElementById("volv").textContent = e.target.value + "%";
  if (master) master.gain.value = e.target.value / 100;
});

function env(g, t, peak, dur) {
  g.gain.setValueAtTime(peak, t);
  g.gain.exponentialRampToValueAtTime(0.001, t + dur);
}
function note(type, freq, t, peak, dur, freqEnd) {
  const o = ctx.createOscillator(), g = ctx.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t);
  if (freqEnd) o.frequency.exponentialRampToValueAtTime(freqEnd, t + dur * 0.8);
  env(g, t, peak, dur);
  o.connect(g); g.connect(master); o.start(t); o.stop(t + dur + 0.02);
}
function burst(t, type, freq, q, peak, dur) {
  const s = ctx.createBufferSource(); s.buffer = noise;
  const f = ctx.createBiquadFilter(); f.type = type; f.frequency.value = freq; f.Q.value = q;
  const g = ctx.createGain(); env(g, t, peak, dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t); s.stop(t + dur + 0.02);
}

// Chaque variante est une fonction jouée à ctx.currentTime.
const VARIANTS = [
  ["1. Shff passe-haut doux (l'actuel)", (t) => burst(t, "highpass", 3500, 1, 0.18, 0.055)],
  ["2. Shff passe-haut plus grave", (t) => burst(t, "highpass", 2400, 1, 0.16, 0.07)],
  ["3. Frottement bande médium", (t) => burst(t, "bandpass", 1800, 0.8, 0.2, 0.09)],
  ["4. Frottement bande long", (t) => burst(t, "bandpass", 1300, 1.2, 0.18, 0.14)],
  ["5. Thock grave (précédent)", (t) => note("sine", 170, t, 0.22, 0.09, 65)],
  ["6. Thock + shff combinés", (t) => { note("sine", 150, t, 0.18, 0.07, 60); burst(t, "highpass", 3000, 1, 0.1, 0.05); }],
  ["7. Double tap léger", (t) => { note("sine", 190, t, 0.14, 0.05, 80); note("sine", 150, t + 0.07, 0.1, 0.05, 70); }],
  ["8. Tic triangle bref", (t) => note("triangle", 480, t, 0.12, 0.04, 320)],
  ["9. Pichenette (glissando bas)", (t) => note("sine", 320, t, 0.15, 0.08, 120)],
  ["10. Quasi silence (souffle très léger)", (t) => burst(t, "highpass", 4000, 1, 0.07, 0.04)],
];

const list = document.getElementById("list");
for (const [label, fn] of VARIANTS) {
  const b = document.createElement("button");
  b.innerHTML = "<b>▶</b> " + label;
  b.addEventListener("click", () => { ensure(); if (ctx) fn(ctx.currentTime); });
  list.appendChild(b);
}
</script>
</body>
</html>
