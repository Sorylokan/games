<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1020">
<title>Little Matsuri</title>
<link rel="icon" href="./assets/icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./assets/apple-touch-icon.png">
<link rel="manifest" href="./manifest.webmanifest">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,700&display=swap">
<link rel="stylesheet" href="./src/ui/styles.css">
</head>
<body>

<div class="app">
  <header class="topbar">
    <div class="brand-group">
      <a class="icon-btn" href="../" data-i18n-title="ui.back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </a>
      <span class="brand">Little Matsuri</span>
    </div>
    <select id="lang" data-i18n-aria="ui.lang"></select>
  </header>

  <main class="table">
    <section class="board-card">
      <div id="board" role="group" data-i18n-aria="ui.board"></div>
    </section>

    <aside class="side">
      <section class="card">
        <h2 data-i18n="ui.size">Grid size</h2>
        <div class="sizes" id="sizes"></div>
        <div class="actions">
          <button type="button" id="hint">Hint</button>
          <button type="button" class="ghost" id="new" data-i18n="ui.new">New grid</button>
          <button type="button" class="ghost" id="restart" data-i18n="ui.restart">Clear the grid</button>
        </div>
      </section>
      <section class="card rules">
        <h2 data-i18n="rules.title">How to play</h2>
        <p data-i18n="rules.goal">Hang one lantern in each district.</p>
        <ul>
          <li data-i18n="rules.lines">One lantern per row and per column.</li>
          <li data-i18n="rules.touch">Two lanterns never touch, not even diagonally.</li>
          <li data-i18n="rules.click">Click: lantern, then cross, then empty. Right click: cross.</li>
        </ul>
      </section>
    </aside>
  </main>
</div>

<div class="overlay" id="win" hidden>
  <div class="modal">
    <h2 data-i18n="win.title">Bravo!</h2>
    <p data-i18n="win.text">The whole district lights up.</p>
    <div class="actions">
      <button type="button" id="win-next"></button>
      <button type="button" class="ghost" id="win-again"></button>
    </div>
  </div>
</div>

<script type="module" src="./src/ui/app.js"></script>
</body>
</html>
