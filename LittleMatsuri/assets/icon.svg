<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <defs>
    <clipPath id="lantern"><ellipse cx="256" cy="265" rx="118" ry="148"/></clipPath>
    <!-- one cherry blossom petal (notched tip), drawn for a crest of radius 1 -->
    <path id="petal" d="M0 -0.1C-0.42 -0.35 -0.4 -0.9 -0.12 -0.98L0 -0.82L0.12 -0.98C0.4 -0.9 0.42 -0.35 0 -0.1z"/>
  </defs>
  <rect id="bg" width="512" height="512" rx="96" fill="#0f1020"/>
  <!-- full moon behind the lantern; dark caps stand out on it -->
  <circle cx="256" cy="265" r="200" fill="#f2e6c4"/>
  <path d="M256 66v38M256 430v18" stroke="#2a1a14" stroke-width="8" stroke-linecap="round"/>
  <ellipse cx="256" cy="265" rx="118" ry="148" fill="#e2402b"/>
  <g clip-path="url(#lantern)">
    <path d="M120 170h272M120 218h272M120 314h272M120 362h272" stroke="#a92a18" stroke-width="6"/>
  </g>
  <!-- cherry blossom crest (a classic "mon") -->
  <g transform="translate(256 265) scale(62)" fill="#fbf3e4">
    <use href="#petal"/><use href="#petal" transform="rotate(72)"/><use href="#petal" transform="rotate(144)"/><use href="#petal" transform="rotate(216)"/><use href="#petal" transform="rotate(288)"/>
    <circle r="0.14" fill="#e2402b"/>
  </g>
  <rect x="188" y="100" width="136" height="30" rx="10" fill="#2a1a14"/>
  <rect x="188" y="400" width="136" height="30" rx="10" fill="#2a1a14"/>
  <path d="M244 448h24l-4 20h-16z" fill="#2a1a14"/>
</svg>
