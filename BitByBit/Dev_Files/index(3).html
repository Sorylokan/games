<!doctype html>
<html lang="fr">
<head>

<title>Bit by Bit</title>

<body>
<style>
/* Layout: barre du haut fine (nom + réglages), puis plateau à gauche et colonne de cartes à droite ; en étroit, tout s'empile.
   Même famille visuelle que Grid of Greed : fonds nuit, traits de 1 px, Fraunces pour les titres et les chiffres. */
:root {
  --bg: #0a0e18;
  --card: #101827;
  --accent: #7fa8d9;
  --line: #26344c;
  --txt: #c3cfe2;
  --mut: #6f7f9a;
  --warn: #ef5b5b;
  --display: "Fraunces", Georgia, "Times New Roman", serif;
  --body: Georgia, "Times New Roman", serif;
  color-scheme: dark;
}
:root[data-skin="palace"] { --bg: #07140e; --card: #0f2318; --accent: #d4af37; --line: #2f5a43; --txt: #d6e6dc; --mut: #7fa08d; }
:root[data-skin="ruby"]   { --bg: #140a0e; --card: #231319; --accent: #d99a5b; --line: #5a2f3c; --txt: #e6d3d8; --mut: #a0808a; }
:root[data-skin="beach"]  { --bg: #eadcbf; --card: #f5ecd9; --accent: #2f7f8c; --line: #d8c6a2; --txt: #3d3326; --mut: #8a7759; color-scheme: light; }
:root[data-skin="forest"] { --bg: #004130; --card: #05362a; --accent: #d6e59c; --line: #1f5a46; --txt: #dcebd9; --mut: #8db3a0; }
:root[data-skin="garden"] { --bg: #cfe8f3; --card: #f7fbf1; --accent: #3e8a3c; --line: #c6dbb2; --txt: #27361f; --mut: #6b8061; color-scheme: light; }
:root[data-skin="spring"]    { --bg: #f7eef0; --card: #fffdfb; --accent: #c4577a; --line: #ecd8de; --txt: #3a2e33; --mut: #8b7880; color-scheme: light; }
:root[data-skin="summer"]    { --bg: #fde9c4; --card: #fffaf0; --accent: #d9702a; --line: #f0d9ad; --txt: #3b2a17; --mut: #8e7350; color-scheme: light; }
:root[data-skin="autumn"]    { --bg: #2a1a12; --card: #33211a; --accent: #e39b4a; --line: #5a3a28; --txt: #f0e0cf; --mut: #b39079; }
:root[data-skin="winter"]    { --bg: #e7eff7; --card: #fbfdff; --accent: #4a7bb0; --line: #d2dfeb; --txt: #22303d; --mut: #6f8396; color-scheme: light; }
:root[data-skin="halloween"] { --bg: #130b1a; --card: #1d1223; --accent: #f08a24; --line: #3f2a46; --txt: #eadcf0; --mut: #9c85a6; }
:root[data-skin="xmas"]      { --bg: #3a0d15; --card: #2b0a10; --accent: #e3c06b; --line: #5e1f2a; --txt: #f6ebe6; --mut: #c49c99; }

* { box-sizing: border-box; }
[hidden] { display: none !important; }
html { background: var(--bg); min-height: 100%; }
html, body { margin: 0; }
body {
  background-color: var(--bg);
  background-image:
    radial-gradient(circle at 85% 6%, color-mix(in srgb, var(--accent) 12%, transparent), transparent 32%),
    radial-gradient(1px 1px at 22% 28%, color-mix(in srgb, var(--txt) 45%, transparent), transparent 65%),
    radial-gradient(1px 1px at 64% 72%, color-mix(in srgb, var(--txt) 30%, transparent), transparent 65%);
  background-size: auto, 300px 300px, 260px 260px;
  background-repeat: no-repeat, repeat, repeat;
  margin: 0;
  color: var(--txt);
  font: 15px/1.45 var(--body);
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
  min-height: 100vh;
  min-height: 100dvh;
}
/* Décors de fond des thèmes « Escapades » (dégradés uniquement) */
:root[data-skin="beach"] body {
  /* la mer en haut, l'écume, puis le sable moucheté (points placés, sans répétition) */
  background-image:
    radial-gradient(1.9px 1.9px at 45.2% 61.3%, rgba(140,110,70,.25), transparent 70%),

    linear-gradient(to bottom, #7fbfc8 0, #a9d6d4 54px, #f3ead6 60px, #f3ead6 63px, transparent 120px);
  background-size: auto, auto, auto, auto, auto, auto, auto, auto, auto, auto, auto, auto, auto, auto, auto, auto, auto, auto, auto, auto, auto, auto, auto, auto, auto, auto, auto;
  background-repeat: no-repeat, no-repeat, no-repeat, no-repeat, no-repeat, no-repeat, no-repeat, no-repeat, no-repeat, no-repeat, no-repeat, no-repeat, no-repeat, no-repeat, no-repeat, no-repeat, no-repeat, no-repeat, no-repeat, no-repeat, no-repeat, no-repeat, no-repeat, no-repeat, no-repeat, no-repeat, no-repeat;
  background-attachment: fixed, fixed, fixed, fixed, fixed, fixed, fixed, fixed, fixed, fixed, fixed, fixed, fixed, fixed, fixed, fixed, fixed, fixed, fixed, fixed, fixed, fixed, fixed, fixed, fixed, fixed, scroll;
}
:root[data-skin="garden"] body::after {
  /* nuages qui dérivent lentement, derrière le jeu */
  content: ""; position: fixed; left: 0; right: 0; top: 0; height: 300px; pointer-events: none; z-index: 0;
  background-image:
    radial-gradient(64px 22px at 200px 36px, rgba(255,255,255,.95) 55%, rgba(255,255,255,0) 72%),
    radial-gradient(40px 24px at 236px 24px, rgba(255,255,255,.95) 55%, rgba(255,255,255,0) 72%),
    radial-gradient(32px 18px at 170px 32px, rgba(255,255,255,.95) 55%, rgba(255,255,255,0) 72%),

    radial-gradient(46px 24px at 738px 18px, rgba(255,255,255,.95) 55%, rgba(255,255,255,0) 72%),
    radial-gradient(34px 18px at 668px 26px, rgba(255,255,255,.95) 55%, rgba(255,255,255,0) 72%),
    radial-gradient(30px 14px at 776px 34px, rgba(255,255,255,.95) 55%, rgba(255,255,255,0) 72%),
    radial-gradient(54px 18px at 1120px 44px, rgba(255,255,255,.95) 55%, rgba(255,255,255,0) 72%),
    radial-gradient(32px 18px at 1146px 34px, rgba(255,255,255,.95) 55%, rgba(255,255,255,0) 72%),
    radial-gradient(26px 14px at 1096px 42px, rgba(255,255,255,.95) 55%, rgba(255,255,255,0) 72%),
    radial-gradient(52px 16px at 430px 170px, rgba(255,255,255,.95) 55%, rgba(255,255,255,0) 72%),

    radial-gradient(24px 12px at 410px 166px, rgba(255,255,255,.95) 55%, rgba(255,255,255,0) 72%),
    radial-gradient(60px 18px at 980px 240px, rgba(255,255,255,.95) 55%, rgba(255,255,255,0) 72%),

  background-size: 1400px 300px; background-repeat: repeat-x;
  opacity: .9;
  animation: drift 180s linear infinite;
}
:root[data-skin="garden"] .app { position: relative; z-index: 1; }
@keyframes drift { from { background-position: 0 0; } to { background-position: 1400px 0; } }
@media (prefers-reduced-motion: reduce) { :root[data-skin="garden"] body::after { animation: none; } }
:root[data-skin="spring"] body {
  /* hanami : ciel blanc rosé qui descend vers un vert tendre */
  background-image:
    radial-gradient(circle at 10% 0%, rgba(255,255,255,.75), transparent 40%),
    linear-gradient(to bottom, #fbf1f3 0%, #f6eaec 55%, #e9f0de 100%);
  background-size: auto, auto;
  background-repeat: no-repeat, no-repeat;
  background-attachment: fixed, fixed;
}

/* le titre passe dans une capsule claire pour rester lisible par-dessus la branche */
:root[data-skin="spring"] .brand {
  background: color-mix(in srgb, var(--card) 88%, transparent);
  border: 1px solid var(--line); border-radius: 999px; padding: 3px 16px 5px;
  backdrop-filter: blur(3px); box-shadow: 0 2px 10px rgba(196, 87, 122, .10);

:root[data-skin="summer"] body {
  /* grand soleil chaud */
  background-image:
    radial-gradient(circle at 85% 4%, rgba(255,250,215,1) 0 40px, rgba(255,230,160,.55) 41px, transparent 220px),
    linear-gradient(to bottom, #fff2d2 0%, #fde3b6 60%, #f9cf96 100%);
  background-size: auto, auto;
  background-repeat: no-repeat, no-repeat;
  background-attachment: fixed, fixed;
}
:root[data-skin="autumn"] body {
  /* lumière rasante de fin d'après-midi */

  background-repeat: no-repeat, no-repeat, no-repeat;
  background-attachment: fixed, fixed, fixed;
}

  background-size: auto;
  background-repeat: no-repeat;
}

  const COLORS = {
    R: '#c8574a', W: '#ece4d6', S: '#d6bd96', G: '#6f9a63', L: '#4d7a52',

  // Fresques dans l'ordre ; après la dernière, la série recommence en plus difficile.
  const MAPS = [
    { name: 'Cœur', map: ['BBBBBBBB','BKKBBKKB','KRRKKRRK','KRWRRRRK','KRRRRRRK','BKRRRRKB','BBKRRKBB','BBBKKBBB'] },

    { name: 'Maison', map: ['BBBBBBBBBBBBBB','BBBBBBKKBBBBBB','BBBBBKRRKBBBBB','BBBBKRRRRKBBBB','BBBKRRRRRRKBBB','BBKRRRRRRRRKBB','BKKKKKKKKKKKKB','BBKSSSSSSSSKBB','BBKSYYSSDDSKBB','BBKSYYSSDDSKBB','BBKSSSSSDDSKBB','BBKSSSSSDDSKBB','BBKKKKKKKKKKBB','GGGGGGGGGGGGGG'] },
    { name: 'Chat', map: ['NNNNNNNNNNNN','NKKNNNNNNKKN','KAPKNNNNKPAK','KAAAKKKKAAAK','KAAAAAAAAAAK','KAYKAAAAKYAK','KAYYAAAAYYAK','KAAAAPPAAAAK','NKAWAKKAWAKN','NKAAWWWWAAKN','NNKKAAAAKKNN','NNNNKKKKNNNN'] },
    { name: 'Toutou', map: ['BBBBBBBBBBBB','BKKBBBBBBKKB','KDDKKKKKKDDK','KDDOOOOOODDK','KDOOOOOOOODK','BKOKOOOOKOKB','BKOOOSSOOOKB','BKOOSKKSOOKB','BBKOSSSSOKBB','BBBKKPPKKBBB','BBBBBKKBBBBB','GGGGGGGGGGGG'] },
    { name: 'Fleur', map: ['BBBBBBBBBBBB','BBBKKBBKKBBB','BBKPPKKPPKBB','BBKPPYYPPKBB','BBBKYOOYKBBB','BBKPPYYPPKBB','BBKPPKKPPKBB','BBBKKGGKKBBB','BBBBBGGBBBBB','BLLBBGGBBLLB','BBLLLGGLLLBB','GGGGGGGGGGGG'] },
    { name: 'Hibou', map: ['NNNNNNNNNNNNNNNN','NNNKKNNNNNNKKNNN','NNNKDKKKKKKDKNNN','NNNKDDDDDDDDKNNN','NNKDWWWDDWWWDKNN','NNKDWKWDDWKWDKNN','NNKDWWWDDWWWDKNN','NNKDDDDOODDDDKNN','NNKDSSDDDDSSDKNN','NNKDSSSSSSSSDKNN','NNKDSSSSSSSSDKNN','NNNKDSSSSSSDKNNN','NNNKDDSSSSDDKNNN','NNNNKOKKKKOKNNNN','LLLLLLLLLLLLLLLL','LLLLLLLLLLLLLLLL'] },
  ];
  // Difficulté selon le rang (0, 1, 2…) : moins de places, files plus mélangées, et on garde
  // le plus dur parmi plus de niveaux générés.
  function levelAt(i) {
    const m = MAPS[i % MAPS.length], round = Math.floor(i / MAPS.length);
    const cap = i < 3 ? 4 : 3;
    const mix = Math.min(16, 3 + i * 1.5);
    const tries = Math.min(24, 4 + i * 3 + round * 4);
    return { name: m.name, round, cap, mix, tries, map: m.map };
  }

  /*LOGIC-START*/
  const DIRS = [[1, 0], [-1, 0], [0, 1], [0, -1]];
  const rand = (a, b) => a + Math.floor(Math.random() * (b - a + 1));
  const pick = arr => arr[Math.floor(Math.random() * arr.length)];
  const clone = g => g.map(r => r.slice());
  const remaining = g => g.reduce((s, r) => s + r.filter(Boolean).length, 0);

  // Zone libre reliée à l'extérieur (bordure de 1 case autour de la fresque comprise)
  function outsideMap(g, N) {
    const W = N + 2, seen = new Uint8Array(W * W), stack = [[-1, -1]];

    seen[0] = 1;
    while (stack.length) {
      const [r, c] = stack.pop();
      for (const [dr, dc] of DIRS) {
        const nr = r + dr, nc = c + dc;
        if (nr < -1 || nc < -1 || nr > N || nc > N) continue;
        const i = (nr + 1) * W + (nc + 1);
        if (seen[i] || !free(nr, nc)) continue;
        seen[i] = 1; stack.push([nr, nc]);
      }
    }
    return seen;
  }
  // Pixels qu'une fourmi peut toucher : pleins, avec un voisin dans la zone extérieure
  function reachable(g, N, color) {
    const W = N + 2, out = outsideMap(g, N), res = [];
    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      const v = g[r][c]; if (!v || (color && v !== color)) continue;
      if (DIRS.some(([dr, dc]) => out[(r + dr + 1) * W + (c + dc + 1)])) res.push([r, c]);
    }
    return res;
  }
  // Une boîte ouverte ramasse tout ce qu'elle peut atteindre de sa couleur (jusqu'à son nombre de fourmis)
  function collect(g, N, color, k) {
    let n = 0;
    while (n < k) {
      const acc = reachable(g, N, color);
      if (!acc.length) break;
      for (const [r, c] of acc) { if (n >= k) break; g[r][c] = null; n++; }

    return n;
  }

    let changed = true;
    while (changed) {
      changed = false;
      for (const b of line) if (b.rem > 0) { const n = collect(g, N, b.color, b.rem); if (n) { b.rem -= n; changed = true; } }

    return line.filter(b => b.rem > 0);
  }
  function buildSequence(target, N) {
    const g = clone(target), seq = [];
    let guard = 0;
    while (remaining(g) && guard++ < 500) {
      const colors = [...new Set(reachable(g, N).map(([r, c]) => g[r][c]))];
      const color = pick(colors);
      const n = collect(g, N, color, rand(4, 12));
      if (n) seq.push({ color, count: n });
    }
    return seq;
  }
  // Joueur prudent simulé : pose toujours la boîte qui débloque le plus
  function solvable(target, N, queues, cap) {
    let g = clone(target), line = [];
    const qs = queues.map(q => q.slice());
    for (let step = 0; step < 500; step++) {
      line = settle(g, N, line);
      if (!remaining(g)) return true;
      if (line.length >= cap) return false;
      let best = null;
      qs.forEach((q, qi) => {
        if (!q.length) return;
        const gg = clone(g), l2 = line.map(b => ({ ...b })).concat({ color: q[0].color, rem: q[0].count });
        const before = remaining(gg), after = settle(gg, N, l2);
        const score = (before - remaining(gg)) * 10 - after.length * 25;
        if (!best || score > best.score) best = { qi, score };
      });
      if (!best) return false;
      const a = qs[best.qi].shift(); line.push({ color: a.color, rem: a.count });
    }
    return false;
  }
  // Joueur qui pose des boîtes au hasard : sert à mesurer la difficulté
  function randomWins(target, N, queues, cap, runs) {
    let wins = 0;
    for (let k = 0; k < runs; k++) {
      let g = clone(target), line = [];
      const qs = queues.map(q => q.slice());
      for (let step = 0; step < 500; step++) {
        line = settle(g, N, line);
        if (!remaining(g)) { wins++; break; }
        const open = qs.filter(q => q.length);
        if (line.length >= cap || !open.length) break;
        const a = pick(open).shift(); line.push({ color: a.color, rem: a.count });
      }
    }
    return wins / runs;
  }
  function candidate(target, N, lvl, nextId) {
    for (let attempt = 0; attempt < 40; attempt++) {
      const seq = buildSequence(target, N);
      const mixed = seq.map((a, i) => ({ a, k: i + Math.random() * lvl.mix })).sort((x, y) => x.k - y.k).map(x => x.a);
      const qs = [[], [], []];
      mixed.forEach(a => qs[rand(0, 2)].push({ id: nextId(), ...a }));
      if (solvable(target, N, qs, lvl.cap)) return qs;
    }
    return null;
  }
  function generate(lvl, nextId) {
    const N = lvl.map.length;
    const target = lvl.map.map(row => [...row].map(ch => ch === '.' ? null : ch));
    let queues = null, easiest = 2;

    for (let t = 0; t < 12; t += 0.2) { const r = 5.6 - t * 0.44, ax = -1 + Math.cos(t) * r, ay = -1 + Math.sin(t) * r; t === 0 ? ctx.moveTo(ax, ay) : ctx.lineTo(ax, ay); }
    ctx.stroke();
    if (carry) tile(-1, -11, 8, carry);
  }

  function drawGhost(ph, flip, carry) {
    ctx.scale(flip, 1); ctx.translate(0, Math.sin(ph * 0.8) * 1.8);
    const g = ctx.createRadialGradient(0, -2, 1, 0, -2, 14);
    g.addColorStop(0, 'rgba(240,230,255,.25)'); g.addColorStop(1, 'rgba(240,230,255,0)');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(0, -2, 14, 0, 7); ctx.fill();
    ctx.fillStyle = 'rgba(246,242,255,.94)';
    ctx.beginPath(); ctx.moveTo(-7, 7); ctx.lineTo(-7, -3); ctx.arc(0, -3, 7, Math.PI, 0); ctx.lineTo(7, 7);
    const w = Math.sin(ph * 2) * 1.2;
    for (let k = 0; k < 4; k++) { const x1 = 7 - (k + 0.5) * 3.5, x2 = 7 - (k + 1) * 3.5; ctx.quadraticCurveTo(x1, 10 + (k % 2 ? -w : w), x2, 7); }
    ctx.closePath(); ctx.fill();
    dot(-2.4, -4, 1.3, '#2a1d33'); dot(2.6, -4, 1.3, '#2a1d33');
    ctx.fillStyle = '#2a1d33'; ctx.beginPath(); ctx.ellipse(0.3, 0, 1.3, 1.7, 0, 0, 7); ctx.fill();
    if (carry) tile(8.5, 2, 8, carry);
  }
  function drawBat(ph, flip, carry) {
    ctx.scale(flip, 1); ctx.translate(0, Math.sin(ph * 1.2) * 2);
    const f = Math.sin(ph * 4);
    ctx.fillStyle = '#6b5580'; ctx.strokeStyle = 'rgba(234,220,240,.35)'; ctx.lineWidth = .6;
    for (const sd of [-1, 1]) {
      ctx.beginPath(); ctx.moveTo(sd * 2, -1);
      ctx.quadraticCurveTo(sd * 8, -7 - f * 4, sd * 13, -3 - f * 3);
      ctx.quadraticCurveTo(sd * 10, -1, sd * 9.5, 2); ctx.quadraticCurveTo(sd * 6, 0, sd * 2, 2); ctx.closePath(); ctx.fill(); ctx.stroke();
    }
    ctx.beginPath(); ctx.ellipse(0, 0.5, 3, 3.8, 0, 0, 7); ctx.fill();
    ctx.beginPath(); ctx.moveTo(-2.2, -2.5); ctx.lineTo(-1.6, -5.5); ctx.lineTo(-0.6, -3); ctx.moveTo(2.2, -2.5); ctx.lineTo(1.6, -5.5); ctx.lineTo(0.6, -3); ctx.fill();
    dot(-1, -1.2, .7, '#f08a24'); dot(1, -1.2, .7, '#f08a24');
    if (carry) tile(0, 9, 7.5, carry);
  }
  function drawElf(ph, flip, carry) {
    ctx.scale(flip, 1);
    const step = Math.sin(ph * 1.7);
    ctx.translate(0, -Math.abs(step) * 1.3);
    ctx.fillStyle = '#2d5a3a';
    ctx.fillRect(-4 + step * 1.2, 8, 3, 2.6); ctx.fillRect(1 - step * 1.2, 8, 3, 2.6);
    ctx.fillStyle = '#b83a3a'; rr(-4.8, -1, 9.6, 9.5, 3); ctx.fill();
    ctx.fillStyle = '#e8c45a'; ctx.fillRect(-4.8, 3.8, 9.6, 1.4);
    ctx.fillStyle = '#f2c8a8'; ctx.beginPath(); ctx.moveTo(-3, -4.8); ctx.lineTo(-5.6, -6.5); ctx.lineTo(-2.6, -3.4); ctx.fill();
    dot(0, -4.4, 3, '#f2c8a8'); dot(2.5, -3.9, .9, '#e3958a'); dot(1.4, -5, .55, '#2c2a26');
    ctx.fillStyle = '#2f7a46'; ctx.beginPath(); ctx.moveTo(-3.8, -6); ctx.lineTo(3.8, -6); ctx.quadraticCurveTo(6, -12, 9, -11); ctx.closePath(); ctx.fill();
    dot(9.2, -11, 1.6, '#f4efe6');
    if (carry) tile(8, 1.5, 8, carry);
  }
  function drawSnowman(ph, flip, carry) {
    ctx.scale(flip, 1); ctx.rotate(Math.sin(ph * 0.9) * 0.06);
    dot(0, 4, 6.5, '#f7f9fc'); dot(0, -5, 4.6, '#f7f9fc');
    ctx.strokeStyle = 'rgba(120,150,180,.5)'; ctx.lineWidth = .8;
    ctx.beginPath(); ctx.arc(0, 4, 6.5, 0, 7); ctx.stroke(); ctx.beginPath(); ctx.arc(0, -5, 4.6, 0, 7); ctx.stroke();
    dot(-1.5, -6, .7, '#22262e'); dot(1.6, -6, .7, '#22262e'); dot(0, 2, .8, '#22262e'); dot(0, 5, .8, '#22262e');
    ctx.fillStyle = '#e8873a'; ctx.beginPath(); ctx.moveTo(0.5, -5); ctx.lineTo(5, -4.4); ctx.lineTo(0.5, -3.9); ctx.fill();
    ctx.fillStyle = '#b83a3a'; ctx.fillRect(-4.2, -1.6, 8.4, 1.8);
    ctx.fillStyle = '#22262e'; ctx.fillRect(-3.4, -12.5, 6.8, 4.5); ctx.fillRect(-5, -8.4, 10, 1.4);
    if (carry) tile(8, 0, 8, carry);
  }

  function drawFox(ph, flip, carry) {
    ctx.scale(flip, 1);
    const step = Math.sin(ph * 1.9);
    ctx.translate(0, -Math.abs(step) * 0.8);
    ctx.strokeStyle = '#4a2a1a'; ctx.lineWidth = 1.5;
    for (const [lx, sg] of [[-4.5, 1], [-2, -1], [3, -1], [5.5, 1]]) { ctx.beginPath(); ctx.moveTo(lx, 3); ctx.lineTo(lx + step * sg * 1.6, 8); ctx.stroke(); }
    const tw = Math.sin(ph * 1.2) * 1.2;
    ctx.fillStyle = '#d9692a';
    ctx.beginPath(); ctx.moveTo(-5, 0); ctx.quadraticCurveTo(-12, -3 + tw, -15, -6 + tw); ctx.quadraticCurveTo(-14, 1 + tw, -6, 3); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#f6eadb'; ctx.beginPath(); ctx.ellipse(-14.2, -5 + tw, 2, 1.5, -0.6, 0, 7); ctx.fill();
    ctx.fillStyle = '#e0742f'; ctx.beginPath(); ctx.ellipse(0, 1, 7, 4, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#f6eadb'; ctx.beginPath(); ctx.ellipse(3.5, 3, 3.4, 2, 0, 0, 7); ctx.fill();
    ctx.fillStyle = '#e0742f';
    ctx.beginPath(); ctx.moveTo(6.2, -6.2); ctx.lineTo(6.4, -10.5); ctx.lineTo(8.6, -6.8); ctx.closePath(); ctx.fill();
    ctx.beginPath(); ctx.moveTo(8.6, -6.6); ctx.lineTo(10, -10.4); ctx.lineTo(10.8, -6); ctx.closePath(); ctx.fill();
    dot(8.4, -3.4, 3.7, '#e0742f');
    ctx.fillStyle = '#e0742f'; ctx.beginPath(); ctx.moveTo(10, -5); ctx.lineTo(13.4, -2.6); ctx.lineTo(10.4, -1); ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#f6eadb'; ctx.beginPath(); ctx.moveTo(8, -1.6); ctx.lineTo(13.2, -2.4); ctx.lineTo(10, -0.2); ctx.closePath(); ctx.fill();
    dot(13.3, -2.7, 0.8, '#2a1a12'); dot(9.4, -4.2, 0.65, '#2a1a12');
    if (carry) tile(14.5, 0.5, 7, carry);
  }
  function drawHedgehog(ph, flip, carry) {
    ctx.scale(flip, 1);
    const k = Math.sin(ph * 1.4);
    ctx.fillStyle = '#5a3d29';
    ctx.beginPath();
    for (let i = 0; i <= 12; i++) {
      const t = Math.PI + (i / 12) * Math.PI, r = i % 2 ? 9.5 : 7;
      const x = -1 + Math.cos(t) * r, y = 3 + Math.sin(t) * r * 0.9;
      i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
    }
    ctx.closePath(); ctx.fill();
    ctx.fillStyle = '#7a5538'; ctx.beginPath(); ctx.ellipse(-1, 1.5, 6.5, 4.2, 0, Math.PI, 0); ctx.fill();
    ctx.fillStyle = '#d9b98f'; ctx.beginPath(); ctx.moveTo(4, 3.5); ctx.quadraticCurveTo(6, -2, 9.5, 2.6); ctx.lineTo(4, 4); ctx.closePath(); ctx.fill();
    dot(9.6, 2.4, 0.9, '#2a1a12'); dot(6.6, 0.8, 0.55, '#2a1a12');
    ctx.fillStyle = '#4a2f1f'; ctx.fillRect(-5 + k, 3.6, 2, 1.8); ctx.fillRect(2 - k, 3.6, 2, 1.8);
    if (carry) tile(-1, -10, 7.5, carry);
  }

  function drawBox(box, i, now) {
    const u = geo.u, s = slotPos(i), [px, py] = P(s.x, s.y);
    const sz = Math.min(64, u * 1.55, geo.w / st.line.length - 14);
    if (!box) {
      const a = reduceMotion ? 0.5 : 0.35 + 0.15 * Math.sin(now / 700 + i);
      ctx.globalAlpha = a; ctx.setLineDash([4, 4]); ctx.strokeStyle = pal.line; ctx.lineWidth = 1;
      rr(px - sz / 2, py - sz / 2, sz, sz, sz * 0.14); ctx.stroke(); ctx.setLineDash([]); ctx.globalAlpha = 1;
      return;
    }
    let k = 1;
    const t = (now - box.placedAt) / 260; if (t < 1) k = 0.85 + 0.15 * (1 - Math.pow(1 - t, 3));
    let alpha = Math.min(1, t * 1.5);
    if (box.doneAt) { const d = (now - box.doneAt) / 500; k = 1 + 0.08 * d; alpha = Math.max(0, 1 - d); }
    const z = sz * k, col = COLORS[box.color], x0 = px - z / 2, y0 = py - z / 2, r = z * 0.14;
    ctx.globalAlpha = alpha * (box.blocked && !box.out ? 0.62 : 1);
    const ink = inkFor(col);
    ctx.fillStyle = col; rr(x0, y0, z, z, r); ctx.fill();
    ctx.fillStyle = 'rgba(255,255,255,.16)'; ctx.fillRect(x0 + z * 0.16, y0 + 1.5, z * 0.68, 1);
    ctx.fillStyle = 'rgba(0,0,0,.18)'; ctx.fillRect(x0 + z * 0.1, y0 + z - 2.5, z * 0.8, 2);
    ctx.strokeStyle = ink; ctx.globalAlpha *= 0.22; ctx.lineWidth = 1; rr(x0 + z * 0.12, y0 + z * 0.12, z * 0.76, z * 0.76, z * 0.08); ctx.stroke();
    ctx.globalAlpha = alpha * (box.blocked && !box.out ? 0.62 : 1);
    // boîte ouverte : le haut du cadre s'écarte pour laisser passer les fourmis
    if (!box.blocked || box.out) { ctx.fillStyle = pal.card; rr(px - z * 0.17, y0 - 3, z * 0.34, 6, 2); ctx.fill(); }
    ctx.fillStyle = ink; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
    ctx.font = `500 ${Math.round(z * 0.42)}px Fraunces, Georgia, serif`;
    ctx.fillText(box.count - box.got, px, py + z * 0.03);
    ctx.globalAlpha = 1;
  }
  function draw(now) {
    if (!st || !geo.u) return;
    const { u, w, h } = geo, N = st.N;
    ctx.clearRect(0, 0, w, h);
    // cadre fin autour de la fresque (comme le dos des cartes de Grid of Greed)
    ctx.strokeStyle = pal.line; ctx.lineWidth = 1;
    rr(u * 0.5, u * 0.5, (N + 1) * u, (N + 1) * u, u * 0.3); ctx.stroke();
    // séparation de la ligne de boîtes
    const ly = (N + 2) * u + 0.5;
    ctx.beginPath(); ctx.moveTo(u * 0.5, ly); ctx.lineTo(w - u * 0.5, ly); ctx.stroke();

    for (let r = 0; r < N; r++) for (let c = 0; c < N; c++) {
      if (!st.target[r][c]) continue;
      const [px, py] = P(c + 0.5, r + 0.5), id = r * N + c, col = st.grid[r][c];
      if (col) {
        const claimed = st.claimed.has(id);
        tile(px, py, u * 0.9, COLORS[col], claimed ? 0.55 : 1);
        if (claimed) { ctx.strokeStyle = pal.txt; ctx.globalAlpha = 0.5; ctx.lineWidth = 1; rr(px - u * 0.45, py - u * 0.45, u * 0.9, u * 0.9, u * 0.14); ctx.stroke(); ctx.globalAlpha = 1; }
      } else {
        const t0 = st.pickedAt.get(id), k = t0 ? Math.min(1, (now - t0) / 300) : 1;
        ctx.fillStyle = pal.line; ctx.globalAlpha = 0.7 * k;
        ctx.beginPath(); ctx.arc(px, py, Math.max(1, u * 0.05), 0, 7); ctx.fill(); ctx.globalAlpha = 1;
      }
    }
    for (const a of st.ants) {
      const p = along(a.pts, Math.min(a.d, a.len));
      drawCarrier(a, p.x, p.y, p.ang, reduceMotion ? 0 : now / 60 + a.seed);
    }
    st.line.forEach((b, i) => drawBox(b, i, now));
    $('count').textContent = st.picked;
    $('bar').style.width = (st.picked / st.total * 100) + '%';
  }

  function loop(now) {
    const dt = Math.min(0.05, (now - lastNow) / 1000); lastNow = now;
    if (st) { update(now, dt); draw(now); }
    requestAnimationFrame(loop);
  }

  $('restart').onclick = () => start(st.li);
  $('speed').onclick = () => {
    speed = speed === 1 ? 2 : 1;
    $('speed').textContent = '×' + speed; $('speed').setAttribute('aria-pressed', String(speed === 2));
  };
  $('skin').onchange = e => setSkin(e.target.value);
  // On ne recalcule que si la largeur change (la hauteur du canvas en dépend : sinon boucle infinie)
  let lastW = 0;
  new ResizeObserver(() => {
    const w = $('board').clientWidth;
    if (Math.abs(w - lastW) < 1) return;
    lastW = w;
    requestAnimationFrame(resize);
  }).observe($('board'));

  const skin = store.get('pc-skin', 'night');
  setSkin(skin);
  const saved = store.get('pc-level', 0);
  start(Number.isInteger(saved) && saved >= 0 && saved < 999 ? saved : 0);
  if (document.fonts) document.fonts.ready.then(() => st && renderUI());
  requestAnimationFrame(loop);
})();
</script>
</body>
</html>
