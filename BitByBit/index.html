<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Bit by Bit</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,700&display=swap">
<link rel="stylesheet" href="./styles/base.css">
<link rel="stylesheet" href="./styles/layout.css">
<link rel="stylesheet" href="./styles/components.css">
<link rel="stylesheet" href="./styles/themes/classic.css">
<link rel="stylesheet" href="./styles/themes/escapades.css">
<link rel="stylesheet" href="./styles/themes/seasons.css">
<link rel="stylesheet" href="./styles/themes/festive.css">
</head>
<body>

<div class="app">
  <header class="topbar">
    <div class="brand-group">
      <a class="icon-btn back" href="../" data-i18n-title="bar.back">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 18l-6-6 6-6"/></svg>
      </a>
      <span class="brand">Bit by Bit</span>
    </div>
    <div class="tools">
      <!-- listes remplies par src/ui/lang.js et src/ui/skin.js ; textes traduits via data-i18n* -->
      <select id="lang" data-i18n-title="bar.lang"></select>
      <select id="skin" data-i18n-title="bar.theme"></select>
      <button type="button" id="speed" class="speed-btn" aria-pressed="false" data-i18n-title="bar.speed">×1</button>
      <button type="button" id="restart" class="icon-btn" data-i18n-title="bar.restart">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/></svg>
      </button>
    </div>
  </header>

  <main class="table">
    <section class="board" id="board">
      <canvas id="cv"></canvas>
      <div class="overlay" id="overlay" hidden></div>
    </section>

    <aside class="side">
      <section class="side-card mural-card">
        <h3><span data-i18n="side.mural">Fresque</span> <small id="lvlNum"></small></h3>
        <p class="level-name" id="lvlName"></p>
        <div class="meter"><i id="bar"></i></div>
        <div class="stats">
          <span><b id="count">0</b> / <span id="total">0</span> <span data-i18n="side.pixels">pixels</span></span>
          <span><span data-i18n="side.line">Ligne</span> <b id="lineUsed">0</b> / <span id="lineCap">0</span></span>
        </div>
        <!-- affiché seulement s'il y a des fresques dans src/data/community.js -->
        <button type="button" class="ghost community-btn" id="communityBtn" hidden></button>
      </section>

      <section class="side-card queues-card">
        <h3><span data-i18n="side.boxes">Boîtes</span> <small id="lineInfo"></small></h3>
        <div class="queues" id="queues"></div>
      </section>

      <p class="rules" id="rules"></p>
    </aside>
  </main>
</div>

<script type="module" src="./src/main.js"></script>
</body>
</html>
