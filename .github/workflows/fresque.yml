# Bit by Bit community murals.
# - "mural" issue opened or edited → validate the code and reply with a play link.
# - "accepted" label added by a maintainer → add the mural to BitByBit/src/data/community.js,
#   run the tests and open a pull request (merged by hand).
# Issue content never goes into shell commands: it is passed through env vars.
name: Community murals

on:
  issues:
    types: [opened, edited, labeled]

permissions:
  contents: write
  issues: write
  pull-requests: write

concurrency:
  group: fresque-${{ github.event.issue.number }}

jobs:
  check:
    if: github.event.action != 'labeled' && contains(github.event.issue.labels.*.name, 'mural')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check the mural code
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
        run: node .github/scripts/fresque.mjs check
      - name: Reply on the issue
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue comment "$ISSUE_NUMBER" --body-file comment.md

  accept:
    if: >-
      github.event.action == 'labeled' && github.event.label.name == 'accepted'
      && contains(github.event.issue.labels.*.name, 'mural')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Add the mural to community.js
        id: add
        env:
          ISSUE_BODY: ${{ github.event.issue.body }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_AUTHOR: ${{ github.event.issue.user.login }}
        run: node .github/scripts/fresque.mjs accept
      - name: Bit by Bit tests
        if: steps.add.outputs.ok == 'true'
        working-directory: BitByBit
        run: node --test "tests/*.test.js"
      - name: Open the pull request
        if: steps.add.outputs.ok == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git switch -c "fresque/ticket-$ISSUE_NUMBER"
          git add BitByBit/src/data/community.js
          git commit -m "$(cat pr-title.txt)"
          git push --force -u origin HEAD
          url=$(gh pr create --base main --title "$(cat pr-title.txt)" --body-file pr-body.md)
          gh issue comment "$ISSUE_NUMBER" --body "🎉 Pull request ready: $url (merge it to publish)."
      - name: Explain the refusal
        if: steps.add.outputs.ok == 'false'
        env:
          GH_TOKEN: ${{ github.token }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
        run: gh issue comment "$ISSUE_NUMBER" --body-file comment.md
