<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Free the Memes - Network Game</title>
<style>
:root { color-scheme: dark; font-family: system-ui, sans-serif; color: #f5f1e8; background: #0f1116; --line:#303541; --surface:#191d25; --accent:#d4f06a; --hot:#ff9867; --muted:#aeb1bd; }
* { box-sizing:border-box; } body { margin:0; padding:24px; } main { max-width:1200px; margin:auto; }
h1 { margin:0 0 8px; font-size:clamp(2rem,5vw,4.5rem); line-height:.9; } h1 span { color:var(--hot); } h2 { font-size:1rem; margin:0 0 14px; }
p { color:var(--muted); } button,input { min-height:40px; padding:9px 12px; border:1px solid var(--line); border-radius:5px; color:inherit; background:#222731; } button { cursor:pointer; background:var(--accent); color:#111318; font-weight:800; } button:disabled { cursor:not-allowed; opacity:.4; }
.lobby { max-width:620px; margin:8vh auto; } .fields { display:grid; grid-template-columns:1fr 1fr auto; gap:8px; margin:24px 0 12px; } .status { min-height:24px; color:var(--muted); }
.game { display:grid; grid-template-columns:minmax(0,1fr) 320px; gap:16px; margin-top:24px; } .panel { padding:18px; background:var(--surface); border:1px solid var(--line); border-radius:8px; }
.board { display:grid; grid-template-columns:repeat(3,1fr); gap:10px; } .area { min-height:145px; padding:13px; border:1px solid var(--line); border-radius:6px; background:#232934; } .area h3 { margin:28px 0 10px; font-size:15px; color:#83dbe3; }
.pieces { display:flex; flex-wrap:wrap; gap:5px; } .piece { padding:5px 7px; border-radius:4px; background:var(--accent); color:#111318; font-size:11px; font-weight:800; } .piece.dead { opacity:.4; text-decoration:line-through; }
.controls { display:grid; gap:8px; } .players { display:grid; gap:7px; margin-top:16px; } .player { display:flex; justify-content:space-between; padding:10px; background:#101218; border:1px solid transparent; } .player.active { border-color:var(--hot); } .player small { display:block; color:var(--muted); }
.log { max-height:260px; overflow:auto; margin-top:16px; color:var(--muted); font-size:12px; line-height:1.45; } .log div { border-bottom:1px solid #252a34; padding:5px 0; }
@media(max-width:760px){.fields,.game{grid-template-columns:1fr}.board{grid-template-columns:1fr 1fr}}
</style>
</head>
<body>
<main id="app"></main>
<script type="module">
import { createLocalGame } from "./src/game/setup.js";
import { GAME_PHASES } from "./src/game/game-state.js";
import { startGame, beginTurn, completeAreaAction, completeAttack, endTurn } from "./src/game/turn-manager.js";
import { createActionRequest } from "./src/networking/messages.js";
import { createHostSession, createClientSession } from "./src/networking/game-session.js";
import { TrysteroNetwork } from "./src/networking/trystero-network.js";
import { createRoomId, getRoomIdFromLocation } from "./src/networking/room.js";
import { resolveMovementAction } from "./src/movement.js";
import { attack, canTargetWithAttack } from "./src/game/combat.js";
import { CHARACTERS } from "./src/data/characters.js";
import { AREAS } from "./src/data/areas.js";

const app = document.querySelector("#app");
const areaNames = Object.fromEntries(Object.values(AREAS).map((area) => [area.id, area.nameKey]));
const players = [
  { id:"player-1", name:"Host" },
  { id:"player-2", name:"Waiting player 2" },
  { id:"player-3", name:"Waiting player 3" },
  { id:"player-4", name:"Waiting player 4" }
];
let room;
let hostSession;
let clientSession;
let state;
let role = "lobby";
let playerId = null;
let roomId = getRoomIdFromLocation() ?? "";
let peerCount = 0;
let status = "offline";
let events = [];

const localName = () => localStorage.getItem("ftm-player-name") || "Player";
const log = (message) => { events = [...events, message].slice(-40); render(); };
const localRoll = (sides) => Math.floor(Math.random() * sides) + 1;
const areaName = (id) => id ?? "Nowhere yet";
const actionForPhase = { [GAME_PHASES.START_TURN]:"BEGIN_TURN", [GAME_PHASES.MOVEMENT]:"MOVE", [GAME_PHASES.AREA_ACTION]:"COMPLETE_AREA_ACTION", [GAME_PHASES.ATTACK]:"COMPLETE_ATTACK", [GAME_PHASES.END_TURN]:"END_TURN" };
const isMyTurn = () => role === "host" ? state?.currentPlayerId === "player-1" : state?.currentPlayerId === playerId;

const render = () => {
  if (!state || state.phase === GAME_PHASES.SETUP) {
    app.innerHTML = `<section class="lobby"><p>FREE THE MEMES / NETWORK GAME</p><h1>Free <span>the</span> Memes.</h1><p>This page is the real network client. No local simulation and no fake turn control.</p><div class="fields"><input id="nickname" value="${localName()}" placeholder="Your nickname"><input id="room" value="${roomId}" placeholder="Room code"><button id="join">${roomId ? "Join room" : "Create room"}</button></div><p class="status">${roomId ? `Room: ${roomId} / ${peerCount} peer(s) / ${status}` : status}</p><button id="start" ${role !== "host" || !room ? "disabled" : ""}>Start network match</button><div class="log">${events.map((line) => `<div>${line}</div>`).join("")}</div></section>`;
    app.querySelector("#nickname").addEventListener("input", (event) => localStorage.setItem("ftm-player-name", event.target.value || "Player"));
    app.querySelector("#join").addEventListener("click", connect);
    app.querySelector("#start").addEventListener("click", startNetworkGame);
    return;
  }

  const active = state.players[state.currentPlayerId];
  const targets = Object.values(state.players).filter((candidate) => candidate.alive && candidate.id !== state.currentPlayerId && canTargetWithAttack(state, state.currentPlayerId, candidate.id));
  app.innerHTML = `<header><p>FREE THE MEMES / NETWORK GAME / ${role.toUpperCase()}</p><h1>${active?.name ?? "Game"}</h1><p>${state.phase.replaceAll("-"," ")} / ${isMyTurn() ? "Your turn" : `Waiting for ${active?.name ?? "the active player"}`}</p></header><div class="game"><section class="panel"><div class="board">${Object.values(state.board.areaAtPosition).map((areaId) => `<article class="area"><small>${areaId}</small><h3>${areaName(areaId)}</h3><div class="pieces">${Object.values(state.players).filter((candidate) => candidate.areaId === areaId).map((candidate) => `<span class="piece ${candidate.alive ? "" : "dead"}">${candidate.name}</span>`).join("") || "No players"}</div></article>`).join("")}</div><div class="log">${events.map((line) => `<div>${line}</div>`).join("")}</div></section><aside class="panel"><h2>Network turn</h2><div class="controls"><button id="primary" ${!isMyTurn() || state.pendingActions.length ? "disabled" : ""}>${state.phase === GAME_PHASES.START_TURN ? "Begin turn" : state.phase === GAME_PHASES.MOVEMENT ? "Roll & move" : state.phase === GAME_PHASES.AREA_ACTION ? "Resolve area" : state.phase === GAME_PHASES.ATTACK ? "Skip attack" : "End turn"}</button>${targets.map((target) => `<button data-target="${target.id}" ${!isMyTurn() ? "disabled" : ""}>Attack ${target.name}</button>`).join("")}</div><div class="players">${Object.values(state.players).map((candidate) => `<div class="player ${candidate.id === state.currentPlayerId ? "active" : ""}"><span>${candidate.name}<small>${candidate.areaId ?? "Nowhere"}</small></span><strong>${candidate.id === playerId || candidate.revealed ? `${candidate.hp}/${candidate.maxHp}` : "hidden"}</strong></div>`).join("")}</div></aside></div>`;
  app.querySelector("#primary").addEventListener("click", primaryAction);
  app.querySelectorAll("[data-target]").forEach((button) => button.addEventListener("click", () => requestAction("ATTACK", { targetId: button.dataset.target })));
};

const applyPublic = (publicState) => { state = { ...state, ...publicState, players: publicState.players }; render(); };
const requestAction = (action, payload = {}) => { clientSession?.requestAction(createActionRequest(playerId, action, payload)); };
const primaryAction = () => { const action = actionForPhase[state.phase]; if (role === "host") { hostHandle({ type:"REQUEST_ACTION", playerId:"player-1", action, payload:{} }); } else requestAction(action); };
const hostHandle = (request) => { const result = hostSession.authority.handleRequest(request); if (!result.ok) log(`Rejected: ${result.message.message}`); else { state = result.state; log(`Host action accepted: ${request.action}`); render(); } };

const startNetworkGame = () => { const started = startGame(hostSession.authority.state); if (!started.ok) return log(`Cannot start: ${started.error}`); hostSession.authority.replaceState(started.state); state = started.state; status = "game started"; render(); };

async function connect() {
  roomId = document.querySelector("#room").value.trim() || createRoomId();
  const name = document.querySelector("#nickname").value.trim() || "Player";
  localStorage.setItem("ftm-player-name", name);
  room = new TrysteroNetwork();
  room.on("PLAYER_JOINED", ({ peerId }) => {
    peerCount += 1;
    if (role === "host") hostSession?.authority.broadcast();
    if (role === "client") room.sendHello(name);
    render();
  });
  room.on("PLAYER_LEFT", ({ peerId }) => { peerCount = Math.max(0, peerCount - 1); render(); });
  const joiningExistingRoom = Boolean(document.querySelector("#room").value.trim());
  if (joiningExistingRoom) {
    role = "client";
    clientSession = createClientSession(room, ({ publicState }, assigned) => { if (publicState) applyPublic(publicState); }, (assigned) => { playerId = assigned; status = `assigned ${assigned}`; render(); });
  } else {
    role = "host";
    const setup = createLocalGame(players.map((player, index) => index === 0 ? { ...player, name } : player));
    state = setup;
  }
  await room.connect(roomId);
  if (role === "host") {
    hostSession = createHostSession(state, room);
  }
  status = "connected";
  render();
}

render();
</script>
</body>
</html>
