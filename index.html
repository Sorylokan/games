<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#0c0b10">
<title>Games – Sorylokan</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- Page fonts only; card fonts are loaded by scripts.js from each card's "fonts" field. -->
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo+Narrow:wght@500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div class="wrap">
  <!-- Translated by scripts.js from locales/: data-i18n (text), data-i18n-html (with tags), data-i18n-aria. -->
  <nav class="top">
    <a class="home" href="../" data-i18n-aria="nav.homeLabel"><span aria-hidden="true">←</span> <span data-i18n="nav.home">Sorylokan</span></a>
    <label class="lang">
      <span class="sr" data-i18n="lang.label">Language</span>
      <select id="lang"></select>
    </label>
  </nav>

  <header class="hero">
    <p class="eyebrow" id="eyebrow"></p>
    <h1 data-i18n-html="hero.title"><i>Sorylokan</i>'s little games</h1>
    <p class="sub" data-i18n="hero.sub"></p>
  </header>

  <!-- Cards are built by scripts.js from card_*.json (listed in cards.json; "featured" picks the spotlight). -->
  <section class="spotlight" id="featured" hidden>
    <h2 class="kicker" data-i18n="featured.label">Featured game</h2>
    <div id="featured-slot"></div>
  </section>

  <section>
    <div class="list-head">
      <h2 class="kicker" id="list-title">Les autres jeux</h2>
      <div class="filters" id="filters" role="group" data-i18n-aria="filter.label"></div>
    </div>
    <ul class="grid" id="catalog"></ul>
  </section>
  <noscript><p>Activez JavaScript pour afficher le catalogue des jeux.</p></noscript>

  <footer>
    <p data-i18n="footer.p2p"></p>
    <a href="https://github.com/sorylokan/games" data-i18n="footer.source">Source code on GitHub</a>
  </footer>
</div>

<script type="module" src="scripts.js"></script>
</body>
</html>
